<!DOCTYPE html>
<html lang="es">

<head>

<title>STRACON - Visualizador de Nube de Puntos</title>

<link rel="stylesheet" type="text/css" href="./build/potree/potree.css">
<link rel="stylesheet" type="text/css" href="./libs/jquery-ui/jquery-ui.min.css">
<link rel="stylesheet" type="text/css" href="./libs/openlayers3/ol.css">
<link rel="stylesheet" type="text/css" href="./libs/spectrum/spectrum.css">
<link rel="stylesheet" type="text/css" href="./libs/jstree/themes/mixed/style.css">


<style>


#logo-climbers {

	position:absolute;
	top:20px;
	right:20px;
	width:180px;
	z-index:10000;
	pointer-events:none;

}



#info-proyecto {

	position:absolute;

	right:20px;
	bottom:20px;

	width:260px;

	background:rgba(0,0,0,0.65);

	color:white;

	padding:15px;

	border-radius:8px;

	font-family:Arial, Helvetica, sans-serif;

	font-size:13px;

	line-height:1.5;

	z-index:9999;

}



#info-proyecto h3 {

	margin:0 0 10px 0;

	font-size:16px;

}



/* OCULTAR CREDITOS ORIGINALES POTREE */

.potree_sidebar_brand,
.potree_sidebar_container .branding,
.pv_about,
.potree_sidebar_container .footer {

	display:none !important;

}


</style>


</head>



<body>


<script src="./libs/jquery/jquery-3.1.1.min.js"></script>
<script src="./libs/spectrum/spectrum.js"></script>
<script src="./libs/jquery-ui/jquery-ui.min.js"></script>

<script src="./libs/other/BinaryHeap.js"></script>
<script src="./libs/tween/tween.min.js"></script>
<script src="./libs/d3/d3.js"></script>
<script src="./libs/proj4/proj4.js"></script>
<script src="./libs/openlayers3/ol.js"></script>
<script src="./libs/i18next/i18next.js"></script>
<script src="./libs/jstree/jstree.js"></script>

<script src="./build/potree/potree.js"></script>
<script src="./libs/plasio/js/laslaz.js"></script>




<div class="potree_container" 
style="position:absolute; width:100%; height:100%; left:0px; top:0px;">



<img id="logo-climbers" 
src="./resources/images/Azul Imagotipo.png">





<div id="info-proyecto">


<h3>
Información del Proyecto
</h3>


<b>Proyecto:</b><br>

STRACON<br><br>


<b>Visualización:</b><br>

Nube de puntos 3D<br><br>


<b>Fecha levantamiento:</b><br>

02-06-2026<br><br>


<b>Procesamiento:</b><br>

Climbers SPA<br><br>


<b>Responsable:</b><br>

Juan Lizana<br>

Ingeniero Geomensor


</div>





<div id="potree_render_area" 
style="background-image:url('./build/potree/resources/images/background.jpg');">

</div>



<div id="potree_sidebar_container"></div>



</div>





<script type="module">


window.viewer = new Potree.Viewer(
	document.getElementById("potree_render_area")
);



viewer.setEDLEnabled(false);

viewer.setFOV(60);

viewer.setPointBudget(1000000);

viewer.loadSettingsFromURL();

viewer.setBackground("skybox");





viewer.loadGUI(() => {


	viewer.setLanguage('es');



	// Mostrar herramientas útiles

	$("#menu_tools").next().show();

	$("#menu_clipping").next().show();



	// Ocultar herramientas avanzadas

	$("#menu_appearance").hide();

	$("#menu_scene").hide();



});








Potree.loadPointCloud(

"./pointclouds/STRACON/metadata.json",

"STRACON",

e => {


	let scene = viewer.scene;

	let pointcloud = e.pointcloud;


	let material = pointcloud.material;


	material.size = 1;

	material.pointSizeType = Potree.PointSizeType.ADAPTIVE;

	material.shape = Potree.PointShape.SQUARE;



	scene.addPointCloud(pointcloud);



	viewer.fitToScreen();



}

);



</script>


</body>

</html>
